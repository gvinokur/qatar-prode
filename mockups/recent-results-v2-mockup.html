<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recent Results V2 — Mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react/": "https://esm.sh/react@19/",
        "react-dom": "https://esm.sh/react-dom@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client",
        "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
        "@mui/material": "https://esm.sh/@mui/material@7.0.2?external=react,react-dom,@emotion/react,@emotion/styled",
        "@mui/material/": "https://esm.sh/@mui/material@7.0.2/",
        "@emotion/react": "https://esm.sh/@emotion/react@11",
        "@emotion/styled": "https://esm.sh/@emotion/styled@11",
        "htm": "https://esm.sh/htm@3",
        "@mui/icons-material": "https://esm.sh/@mui/icons-material@7?external=react,react-dom,@mui/material,@emotion/react,@emotion/styled",
        "@mui/icons-material/": "https://esm.sh/@mui/icons-material@7/"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import htm from 'htm';
    import { 
      ThemeProvider, createTheme, CssBaseline, 
      Container, Box, Stack,
      Card, CardContent, CardHeader,
      Typography, Button, Divider, 
      Skeleton
    } from '@mui/material';
    import CheckCircleOutlineIcon from '@mui/icons-material/CheckCircleOutline';
    import CancelOutlinedIcon from '@mui/icons-material/CancelOutlined';
    import WatchLaterIcon from '@mui/icons-material/WatchLater';
    import HistoryIcon from '@mui/icons-material/History';
    import SportsScoreIcon from '@mui/icons-material/SportsScore';

    const html = htm.bind(React.createElement);

    const theme = createTheme({
      palette: {
        mode: 'dark',
        background: {
          default: '#0a0a0a',
          paper: '#1a1a1a',
        },
        primary: {
          main: '#a78bfa',
          contrastText: '#ffffff'
        },
        success: {
          main: '#4ade80',
        },
        error: {
          main: '#f87171',
        },
        warning: {
          main: '#fbbf24',
        },
        text: {
          primary: '#e5e7eb',
          secondary: '#9ca3af',
        },
        divider: 'rgba(255, 255, 255, 0.08)'
      },
      typography: {
        fontFamily: "'Archivo', Roboto, sans-serif",
      },
      shape: { borderRadius: 12 },
    });

    function GameItem({ item }) {
      const isFinished = item.status === 'finished';
      const isPending = item.status === 'pending' || item.status === 'about_to_start';
      const hasGuess = item.userHomeGuess !== null;
      const isCorrect = item.points > 0;
      const isExact = hasGuess && isFinished && item.userHomeGuess === item.homeScore && item.userAwayGuess === item.awayScore;

      let subtext = '';
      if (isPending) {
        const statusText = item.status === 'about_to_start' ? 'About to start' : 'Match in progress';
        const predictionText = hasGuess ? ` • Your prediction: ${item.userHomeGuess}-${item.userAwayGuess}` : ' • No prediction';
        subtext = statusText + predictionText;
      } else if (!hasGuess) {
        subtext = 'You didn\'t enter a prediction';
      } else if (isExact) {
        subtext = 'Exact prediction';
      } else if (isCorrect) {
        subtext = `Correct prediction • Your prediction: ${item.userHomeGuess}-${item.userAwayGuess}`;
      } else {
        subtext = `Your prediction: ${item.userHomeGuess}-${item.userAwayGuess}`;
      }

      let icon;
      if (isPending) {
        icon = html`<${WatchLaterIcon} sx=${{ color: 'warning.main', fontSize: 20, mt: 0.3, flexShrink: 0 }} />`;
      } else if (!hasGuess || !isCorrect) {
        icon = html`<${CancelOutlinedIcon} sx=${{ color: 'error.main', fontSize: 20, mt: 0.3, flexShrink: 0 }} />`;
      } else {
        icon = html`<${CheckCircleOutlineIcon} sx=${{ color: 'success.main', fontSize: 20, mt: 0.3, flexShrink: 0 }} />`;
      }

      return html`
        <${Box} sx=${{ display: 'flex', alignItems: 'flex-start', gap: 1.5, py: 1 }}>
          ${icon}
          <${Box} sx=${{ flex: 1, minWidth: 0 }}>
            <${Box} sx=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 1 }}>
              <${Typography} variant="body2" sx=${{ fontWeight: 500, noWrap: true }}>
                ${item.homeTeam} ${isFinished ? `${item.homeScore}–${item.awayScore}` : 'vs'} ${item.awayTeam}
              <//>
              <${Typography} variant="body2" color=${isCorrect ? 'success.main' : 'text.secondary'} sx=${{ fontWeight: 600, flexShrink: 0 }}>
                ${isFinished ? (isCorrect ? `+${item.points}` : '0') : '--'} pts
              <//>
            <//>
            <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block' }}>
              ${subtext}
            <//>
          <//>
        <//>
      `;
    }

    const mockGames = [
      { id: 1, homeTeam: 'Argentina', awayTeam: 'France', homeScore: 3, awayScore: 3, userHomeGuess: 3, userAwayGuess: 3, points: 5, status: 'finished' },
      { id: 2, homeTeam: 'Croatia', awayTeam: 'Morocco', homeScore: 2, awayScore: 1, userHomeGuess: 1, userAwayGuess: 0, points: 2, status: 'finished' },
      { id: 3, homeTeam: 'Netherlands', awayTeam: 'USA', homeScore: 3, awayScore: 1, userHomeGuess: null, userAwayGuess: null, points: 0, status: 'finished' },
      { id: 4, homeTeam: 'Brazil', awayTeam: 'South Korea', homeScore: 4, awayScore: 1, userHomeGuess: 2, userAwayGuess: 2, points: 0, status: 'finished' },
      { id: 5, homeTeam: 'Portugal', awayTeam: 'Switzerland', homeScore: 6, awayScore: 1, userHomeGuess: 2, userAwayGuess: 0, points: 2, status: 'finished' },
      { id: 6, homeTeam: 'Spain', awayTeam: 'Italy', homeScore: 1, awayScore: 1, userHomeGuess: 1, userAwayGuess: 1, points: 0, status: 'pending' },
      { id: 7, homeTeam: 'Germany', awayTeam: 'England', homeScore: 0, awayScore: 0, userHomeGuess: 2, userAwayGuess: 1, points: 0, status: 'about_to_start' },
      { id: 8, homeTeam: 'Japan', awayTeam: 'Belgium', homeScore: 2, awayScore: 2, userHomeGuess: null, userAwayGuess: null, points: 0, status: 'pending' },
      { id: 9, homeTeam: 'Uruguay', awayTeam: 'Ghana', homeScore: 2, awayScore: 0, userHomeGuess: 2, userAwayGuess: 0, points: 5, status: 'finished' },
      { id: 10, homeTeam: 'Senegal', awayTeam: 'Ecuador', homeScore: 1, awayScore: 2, userHomeGuess: 1, userAwayGuess: 1, points: 0, status: 'finished' },
    ];

    function MockupApp() {
      const [state, setState] = React.useState('populated');

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${Container} maxWidth="sm" sx=${{ py: 4 }}>
            <${Box} sx=${{ mb: 4, textAlign: 'center' }}>
              <${Typography} variant="h5" sx=${{ fontWeight: 700, mb: 1 }}>Recent Results V2<//>
              <${Typography} variant="body2" color="text.secondary">
                Updated Recent Results widget focusing on all games and pending status.
              <//>
            <//>

            <${Stack} direction="row" spacing=${1} sx=${{ mb: 3, justifyContent: 'center' }}>
              <${Button} size="small" variant=${state === 'loading' ? 'contained' : 'outlined'} onClick=${() => setState('loading')}>Loading<//>
              <${Button} size="small" variant=${state === 'empty' ? 'contained' : 'outlined'} onClick=${() => setState('empty')}>Empty<//>
              <${Button} size="small" variant=${state === 'populated' ? 'contained' : 'outlined'} onClick=${() => setState('populated')}>Populated<//>
            <//>

            <${Card} sx=${{ height: '100%', display: 'flex', flexDirection: 'column', border: '1px solid', borderColor: 'divider', boxShadow: 'none' }}>
              <${CardHeader} 
                avatar=${html`<${HistoryIcon} color="primary" />`}
                title=${html`<${Typography} variant="subtitle1" sx=${{ fontWeight: 600 }}>Recent Results<//>`}
                sx=${{ pb: 1 }}
              />
              <${CardContent} sx=${{ flexGrow: 1, pt: 0 }}>
                ${state === 'loading' && html`
                  <${Stack} spacing=${1}>
                    ${[1, 2, 3, 4, 5].map(i => html`
                      <${Box} key=${i} sx=${{ py: 1 }}>
                        <${Skeleton} variant="text" width="60%" height=${20} />
                        <${Skeleton} variant="text" width="40%" height=${14} />
                      <//>
                    `)}
                  <//>
                `}

                ${state === 'empty' && html`
                  <${Box} sx=${{ textAlign: 'center', py: 6 }}>
                    <${SportsScoreIcon} sx=${{ fontSize: 48, color: 'text.disabled', mb: 2 }} />
                    <${Typography} variant="body2" color="text.secondary" sx=${{ fontWeight: 500 }}>
                      No recent games yet
                    <//>
                    <${Typography} variant="caption" color="text.secondary">
                      Games will appear here once they start or finish.
                    <//>
                  <//>
                `}

                ${state === 'populated' && html`
                  <${Box}>
                    <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', mb: 1, lineHeight: 1.2 }}>
                      Recent Games
                    <//>
                    <${Stack} divider=${html`<${Divider} />`}>
                      ${mockGames.map(game => html`
                        <${GameItem} key=${game.id} item=${game} />
                      `)}
                    <//>
                  <//>
                `}
              <//>
              <${Box} sx=${{ mt: 'auto', p: 2, pt: 1, textAlign: 'center' }}>
                <${Button} variant="text" size="small" fullWidth>
                  See Full Statistics
                <//>
              <//>
            <//>
          <//>
        <//>
      `;
    }

    const root = createRoot(document.getElementById('root'));
    root.render(html`<${MockupApp} />`);
  </script>
</body>
</html>
